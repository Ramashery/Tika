<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | Tika</title>
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="icon" href="/Tika/favicon.svg" type="image/svg+xml">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/Tika/admin.css">

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div id="admin-panel">
        <div id="login-screen">
            <div class="login-box">
                <h2>Вход в админ-панель</h2>
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Пароль" required>
                    <button type="submit">Войти</button>
                    <p id="login-error"></p>
                </form>
            </div>
        </div>

        <div class="admin-container">
            <div class="admin-sidebar">
                <h3>Tika — Админ</h3>
                <ul class="admin-tabs">
                    <li class="admin-tab active" data-tab="home">Главная страница</li>
                    <li class="admin-tab" data-tab="services">Услуги</li>
                    <li class="admin-tab" data-tab="blog">Блог</li>
                    <li class="admin-tab" data-tab="creative">Творческое</li>
                    <li class="admin-tab" data-tab="reviews">Отзывы</li>
                </ul>
                <button id="logout-btn">Выйти</button>
            </div>
            <div class="admin-content">
                <a href="/Tika/" id="admin-close-btn" title="На сайт">×</a>
                <div class="tab-content active" data-tab-content="home"></div>
                <div class="tab-content" data-tab-content="services"></div>
                <div class="tab-content" data-tab-content="blog"></div>
                <div class="tab-content" data-tab-content="creative"></div>
                <div class="tab-content" data-tab-content="reviews"></div>
            </div>
        </div>
    </div>
    
    <script type="module" src="/Tika/admin.js"></script>

</body>
</html>
