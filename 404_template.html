<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script>
      (function() {
        var raw = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        try {
            // 1. Decode percent-encoding
            var path;
            try { path = decodeURIComponent(raw); } catch(e) { path = raw; }

            // 2. Split into non-empty segments — collapses ALL duplicate slashes automatically
            var segments = path.split('/').filter(function(s){ return s.length > 0; });

            // 3. Fix case: first segment must be exactly 'Tika', rest → lowercase
            if (segments.length > 0 && segments[0].toLowerCase() === 'tika') {
                segments[0] = 'Tika';
            }
            for (var i = 1; i < segments.length; i++) {
                segments[i] = segments[i].toLowerCase();
            }

            // 4. Rebuild with leading and trailing slash
            var clean = '/' + segments.join('/') + '/';
            var normalized = clean + search + hash;
            var current = raw + search + hash;

            if (normalized !== current) {
                window.location.replace(normalized);
            }
        } catch(e) {
            console.error('URL normalization failed', e);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | Tika</title>
    <meta name="robots" content="noindex, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Tika/styles.css">

    <style>
        body { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            text-align: center; 
            padding: 20px;
        }
        .error-container { 
            max-width: 600px; 
            width: 100%;
            padding: 40px; 
            background: var(--color-card); 
            border: 1px solid var(--color-border); 
            border-radius: 8px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { 
            font-size: clamp(3rem, 5vw, 6rem); 
            margin: 0 0 10px; 
            color: var(--color-accent); 
            line-height: 1;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            opacity: 0.9;
        }
        p { 
            font-size: 1.1rem; 
            margin-bottom: 30px; 
            opacity: 0.8;
        }
        .btn-home { 
            display: inline-block;
            color: var(--color-bg); 
            background: var(--color-accent); 
            padding: 12px 30px; 
            border-radius: 4px; 
            text-decoration: none; 
            font-weight: 600;
            transition: all 0.3s ease; 
        }
        .btn-home:hover { 
            background: #fff; 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(184, 216, 232, 0.4);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Страница не найдена</h2>
        <p>Страница была удалена, переименована или временно недоступна.</p>
        <a href="/Tika/" class="btn-home">На главную</a>
    </div>
</body>
</html>
